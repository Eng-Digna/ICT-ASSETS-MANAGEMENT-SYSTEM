spring.application.name=ict-assets-management
spring.config.import=optional:file:.env[.properties]

# Database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Development seed configuration
app.seed-admin=${APP_SEED_ADMIN:true}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway owns schema creation and evolution.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.ignore-migration-patterns=versioned:missing
spring.flyway.validate-on-migrate=false

# JWT settings
jwt.secret=${JWT_SECRET:change-me-in-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security defaults
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

